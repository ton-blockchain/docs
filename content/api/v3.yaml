openapi: 3.0.0
info:
  title: TON Index (Go)
  description: TON Index collects data from a full node, stores it in a PostgreSQL database, and provides an API for the indexed data.
  version: 1.2.6
  contact: {}
servers:
  - url: https://toncenter.com
  - url: https://testnet.toncenter.com
paths:
  /api/v3/accountStates:
    get:
      security:
        - APIKeyHeader: []
        - APIKeyQuery: []
      description: Query account states that match the specified filters.
      tags:
        - Accounts
      summary: Get account states
      operationId: api_v3_get_account_states
      parameters:
        - name: address
          in: query
          description: "List of addresses in any form. Maximum: 1000 addresses."
          required: true
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: include_boc
          in: query
          description: "Include code and data BoCs. Defaults to `true`."
          schema:
            type: boolean
            default: true
        - name: code_hash
          in: query
          description: Filter the requested addresses by contract code hash. Repeat the parameter to supply multiple hashes.
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountStatesResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestError"
  /api/v3/actions:
    get:
      security:
        - APIKeyHeader: []
        - APIKeyQuery: []
      description: Query actions that match the specified filters.
      tags:
        - Actions and traces
      summary: Get actions
      operationId: api_v3_get_actions
      parameters:
        - name: account
          in: query
          description: Account address in hex, base64, or base64url form.
          schema:
            type: string
        - name: tx_hash
          in: query
          description: Find actions by transaction hash.
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: msg_hash
          in: query
          description: Find actions by message hash.
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: action_id
          in: query
          description: Find actions by `action_id`.
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: trace_id
          in: query
          description: Find actions by `trace_id`.
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: mc_seqno
          in: query
          description: Query actions for traces completed in the masterchain block with the specified sequence number.
          schema:
            type: integer
            format: int32
        - name: start_utime
          in: query
          description: Query actions for traces with `trace_end_utime >= start_utime`.
          schema:
            type: integer
            format: int32
            minimum: 0
        - name: end_utime
          in: query
          description: Query actions for traces with `trace_end_utime <= end_utime`.
          schema:
            type: integer
            format: int32
            minimum: 0
        - name: start_lt
          in: query
          description: Query actions for traces with `trace_end_lt >= start_lt`.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: end_lt
          in: query
          description: Query actions for traces with `trace_end_lt <= end_lt`.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: action_type
          in: query
          description: Filter by the stored action type. See [action classification](/api/v3/action-types).
          explode: true
          schema:
            type: array
            items:
              anyOf:
              - type: string
                enum:
                - call_contract
                - contract_deploy
                - gasless_request
                - ton_transfer
                - auction_bid
                - change_dns
                - dex_deposit_liquidity
                - dex_withdraw_liquidity
                - delete_dns
                - renew_dns
                - election_deposit
                - election_recover
                - jetton_burn
                - jetton_swap
                - jetton_transfer
                - jetton_mint
                - nft_mint
                - tick_tock
                - stake_deposit
                - stake_withdrawal
                - stake_withdrawal_request
                - subscribe
                - unsubscribe
                - auction_outbid
                - cocoon_client_change_secret_hash
                - cocoon_client_increase_stake
                - cocoon_client_register
                - cocoon_client_request_refund
                - cocoon_client_top_up
                - cocoon_client_withdraw
                - cocoon_grant_refund
                - cocoon_proxy_charge
                - cocoon_proxy_payout
                - cocoon_register_proxy
                - cocoon_unregister_proxy
                - cocoon_worker_payout
                - coffee_create_pool
                - coffee_create_pool_creator
                - coffee_create_vault
                - coffee_mev_protect_hold_funds
                - coffee_mev_protect_failed_swap
                - coffee_staking_claim_rewards
                - coffee_staking_deposit
                - coffee_staking_withdraw
                - dns_purchase
                - dns_release
                - evaa_liquidate
                - evaa_supply
                - evaa_withdraw
                - jvault_claim
                - jvault_stake
                - jvault_unstake
                - jvault_unstake_request
                - layerzero_commit_packet
                - layerzero_dvn_verify
                - layerzero_receive
                - layerzero_send
                - layerzero_send_tokens
                - multisig_approve
                - multisig_create_order
                - multisig_execute
                - nft_cancel_auction
                - nft_cancel_sale
                - nft_discovery
                - nft_finish_auction
                - nft_purchase
                - nft_put_on_auction
                - nft_put_on_sale
                - nft_transfer
                - nft_update_sale
                - teleitem_cancel_auction
                - teleitem_start_auction
                - tgbtc_burn
                - tgbtc_burn_fallback
                - tgbtc_dkg_log_fallback
                - tgbtc_mint
                - tgbtc_mint_fallback
                - tgbtc_new_key
                - tgbtc_new_key_fallback
                - tonco_deploy_pool
                - vesting_add_whitelist
                - vesting_send_message
                - unknown
              - type: string
        - name: exclude_action_type
          in: query
          description: Exclude specified action types. See [action classification](/api/v3/action-types).
          explode: true
          schema:
            type: array
            items:
              anyOf:
              - type: string
                enum:
                - call_contract
                - contract_deploy
                - gasless_request
                - ton_transfer
                - auction_bid
                - change_dns
                - dex_deposit_liquidity
                - dex_withdraw_liquidity
                - delete_dns
                - renew_dns
                - election_deposit
                - election_recover
                - jetton_burn
                - jetton_swap
                - jetton_transfer
                - jetton_mint
                - nft_mint
                - tick_tock
                - stake_deposit
                - stake_withdrawal
                - stake_withdrawal_request
                - subscribe
                - unsubscribe
                - auction_outbid
                - cocoon_client_change_secret_hash
                - cocoon_client_increase_stake
                - cocoon_client_register
                - cocoon_client_request_refund
                - cocoon_client_top_up
                - cocoon_client_withdraw
                - cocoon_grant_refund
                - cocoon_proxy_charge
                - cocoon_proxy_payout
                - cocoon_register_proxy
                - cocoon_unregister_proxy
                - cocoon_worker_payout
                - coffee_create_pool
                - coffee_create_pool_creator
                - coffee_create_vault
                - coffee_mev_protect_hold_funds
                - coffee_mev_protect_failed_swap
                - coffee_staking_claim_rewards
                - coffee_staking_deposit
                - coffee_staking_withdraw
                - dns_purchase
                - dns_release
                - evaa_liquidate
                - evaa_supply
                - evaa_withdraw
                - jvault_claim
                - jvault_stake
                - jvault_unstake
                - jvault_unstake_request
                - layerzero_commit_packet
                - layerzero_dvn_verify
                - layerzero_receive
                - layerzero_send
                - layerzero_send_tokens
                - multisig_approve
                - multisig_create_order
                - multisig_execute
                - nft_cancel_auction
                - nft_cancel_sale
                - nft_discovery
                - nft_finish_auction
                - nft_purchase
                - nft_put_on_auction
                - nft_put_on_sale
                - nft_transfer
                - nft_update_sale
                - teleitem_cancel_auction
                - teleitem_start_auction
                - tgbtc_burn
                - tgbtc_burn_fallback
                - tgbtc_dkg_log_fallback
                - tgbtc_mint
                - tgbtc_mint_fallback
                - tgbtc_new_key
                - tgbtc_new_key_fallback
                - tonco_deploy_pool
                - vesting_add_whitelist
                - vesting_send_message
                - unknown
              - type: string
        - name: supported_action_types
          in: query
          description: Supported action types or version shortcuts. See [classification presets](/api/v3/action-types#classification-presets).
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: include_accounts
          in: query
          description: Include the `accounts` array for each action in the response.
          schema:
            type: boolean
            default: false
        - name: include_transactions
          in: query
          description: Include the `transactions_full` array with detailed transaction data for each action in the response.
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          description: Limit the number of rows to return. Use with `offset` to batch requests.
          schema:
            type: integer
            format: int32
            default: 10
            minimum: 1
            maximum: 1000
        - name: offset
          in: query
          description: Skip the first N rows. Use with `limit` to batch requests.
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: sort
          in: query
          description: Sort actions by `lt`.
          schema:
            type: string
            default: desc
            enum:
              - asc
              - desc
        - name: cursor
          in: query
          description: Continue after the page that returned this `next_cursor`. Send the same filters and sort; do not
            combine with `offset`.
          schema:
            type: string
        - name: X-Actions-Version
          in: header
          description: Action type or version shortcut. Overrides `supported_action_types` when supplied. Defaults to `latest` when neither is supplied.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionsResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestError"
  /api/v3/addressBook:
    get:
      security:
        - APIKeyHeader: []
        - APIKeyQuery: []
      description: Query the address book for the specified addresses.
      tags:
        - Accounts
      summary: Address book
      operationId: api_v3_get_address_book
      parameters:
        - name: address
          in: query
          description: "List of addresses in any form to include in the address book. Maximum: 1024 addresses."
          required: true
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericAddressBook"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestError"
  /api/v3/addressInformation:
    get:
      security:
        - APIKeyHeader: []
        - APIKeyQuery: []
      description: Get smart contract information for the specified account.
      tags:
        - API v2
      summary: Get address information
      operationId: api_v3_get_v2_addressInformation
      parameters:
        - name: address
          in: query
          description: Account address in any form.
          required: true
          schema:
            type: string
        - name: use_v2
          in: query
          description: Use the API v2 method. This option is not recommended.
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2AddressInformation"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestError"
  /api/v3/adjacentTransactions:
    get:
      security:
        - APIKeyHeader: []
        - APIKeyQuery: []
      description: Get the parent transaction, child transactions, or both for the specified transaction.
      tags:
        - Blockchain data
      summary: Get adjacent transactions
      operationId: api_v3_get_adjacent_transactions
      parameters:
        - name: hash
          in: query
          description: Transaction hash.
          schema:
            type: string
        - name: direction
          in: query
          description: Direction of the message relative to the transaction.
          schema:
            type: string
            enum:
              - in
              - out
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionsResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestError"
  /api/v3/balanceChanges:
    get:
      security:
        - APIKeyHeader: []
        - APIKeyQuery: []
      description: Calculate balance changes for a trace or action. Supply `trace_id` or `action_id`. If only `action_id` is supplied, the API finds its trace.
      tags:
        - Actions and traces
      summary: Get balance changes
      operationId: api_v3_get_balance_changes
      parameters:
        - name: trace_id
          in: query
          description: Trace ID. If supplied with `action_id`, the action is looked up within this trace.
          schema:
            type: string
        - name: action_id
          in: query
          description: Action ID. If supplied, return changes for this action instead of the entire trace.
          schema:
            type: string
      responses:
        "200":
          description: Balance changes. An action absent from the selected trace returns null maps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceChangesResult"
        "400":
          description: Neither identifier was supplied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexError"
        "404":
          description: The action ID could not be resolved to a trace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexError"
        "422":
          description: The request could not be parsed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexError"
        "500":
          description: The trace could not be processed or a server error occurred.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexError"
  /api/v3/blocks:
    get:
      security:
        - APIKeyHeader: []
        - APIKeyQuery: []
      description: Return blocks that match the specified filters.
      tags:
        - Blockchain data
      summary: Get blocks
      operationId: api_v3_get_blocks
      parameters:
        - name: workchain
          in: query
          description: Workchain of the block.
          schema:
            type: integer
            format: int32
        - name: shard
          in: query
          description: "Shard ID of the block. Provide this parameter with `workchain`. Example: `8000000000000000`."
          schema:
            type: string
        - name: seqno
          in: query
          description: "Sequence number of the block. Provide this parameter with `workchain` and `shard`."
          schema:
            type: integer
            format: int32
        - name: root_hash
          in: query
          description: Root hash of the block.
          schema:
            type: string
        - name: file_hash
          in: query
          description: File hash of the block.
          schema:
            type: string
        - name: mc_seqno
          in: query
          description: Masterchain block sequence number.
          schema:
            type: integer
            format: int32
        - name: start_utime
          in: query
          description: Query blocks with a generation timestamp at or after the specified timestamp.
          schema:
            type: integer
            format: int32
            minimum: 0
        - name: end_utime
          in: query
          description: Query blocks with a generation timestamp at or before the specified timestamp.
          schema:
            type: integer
            format: int32
            minimum: 0
        - name: start_lt
          in: query
          description: Query blocks where `lt` is at or above the specified value.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: end_lt
          in: query
          description: Query blocks where `lt` is at or below the specified value.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          description: Limit the number of rows to return. Use with `offset` to batch requests.
          schema:
            type: integer
            format: int32
            default: 10
            minimum: 1
            maximum: 1000
        - name: offset
          in: query
          description: Skip the first N rows. Use with `limit` to batch requests.
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: sort
          in: query
          description: Sort blocks by generation timestamp.
          schema:
            type: string
            default: desc
            enum:
              - asc
              - desc
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlocksResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestError"
  /api/v3/decode:
    get:
      security:
        - APIKeyHeader: []
        - APIKeyQuery: []
      description: >-
        Decode opcodes and message bodies. Opcodes can be in hexadecimal (with or without the `0x` prefix) or decimal
        format. Bodies can be in base64 or hexadecimal format.
      tags:
        - Utils
      summary: Decode opcodes and bodies (GET)
      operationId: api_v3_get_decode
      parameters:
        - name: opcodes
          in: query
          description: List of opcodes to decode in hexadecimal or decimal format. An unprefixed value that parses as unsigned 32-bit hexadecimal is interpreted as hexadecimal.
          explode: true
          schema:
            type: array
            maxItems: 1000
            items:
              type: string
        - name: bodies
          in: query
          description: List of message bodies to decode in base64 or hexadecimal format.
          explode: true
          schema:
            type: array
            maxItems: 1000
            items:
              type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecodeResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestError"
    post:
      security:
        - APIKeyHeader: []
        - APIKeyQuery: []
      description: >-
        Decode opcodes and message bodies. Opcodes can be in hexadecimal (with or without the `0x` prefix) or decimal
        format. Bodies can be in base64 or hexadecimal format. Use POST for long parameters that may be truncated in
        GET requests.
      tags:
        - Utils
      summary: Decode opcodes and bodies (POST)
      operationId: api_v3_post_decode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecodeRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecodeResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestError"
  /api/v3/dns/records:
    get:
      security:
        - APIKeyHeader: []
        - APIKeyQuery: []
      description: Query DNS records matching the specified filters. Supports `.ton` and `.t.me` records.
      tags:
        - DNS
      summary: Get DNS records
      operationId: api_v3_get_dns_records
      parameters:
        - name: wallet
          in: query
          description: Wallet address in any form. Returns DNS records in the wallet category that contain this address.
          schema:
            type: string
        - name: domain
          in: query
          description: Domain name to search for. Returns DNS records with this exact domain name.
          schema:
            type: string
        - name: limit
          in: query
          description: Limit the number of rows to return. Use with `offset` to batch requests.
          schema:
            type: integer
            format: int32
            default: 100
            minimum: 1
            maximum: 1000
        - name: offset
          in: query
          description: Skip the first N rows. Use with `limit` to batch requests.
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DNSRecordsResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestError"
  /api/v3/dns/activeAuctions:
    get:
      security:
        - APIKeyHeader: []
        - APIKeyQuery: []
      description: >-
        Returns DNS auctions where the address is the current leading bidder.
        Use `bidding` for open auctions and `won` for ended but unclaimed
        auctions. Claimed auctions are no longer returned. Ordering for
        `bidding` and `all` can change as auctions update. Use larger limits
        when paginating. Set `include_nft_items` to include NFT details.
        NFT and collection metadata is returned separately.
      tags:
        - DNS
      summary: Get DNS auctions by bidder
      operationId: api_v3_get_dns_active_auctions
      parameters:
        - name: bidder
          in: query
          description: Address of the current leading bidder.
          required: true
          schema:
            type: string
        - name: state
          in: query
          description: Filter by auction state.
          schema:
            type: string
            default: all
            enum:
              - all
              - won
              - bidding
        - name: include_nft_items
          in: query
          description: Include NFT item details.
          schema:
            type: boolean
            default: false
        - name: after
          in: query
          description: Opaque pagination cursor from `next_cursor` of the previous page. Returns rows strictly after it and is preferred over `offset`.
          schema:
            type: string
        - name: limit
          in: query
          description: Limit the number of rows to return.
          schema:
            type: integer
            format: int32
            default: 100
            minimum: 1
            maximum: 1000
        - name: offset
          in: query
          description: Rows to skip. Do not combine this parameter with `after`.
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DNSAuctionsResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestError"
  /api/v3/estimateFee:
    post:
      security:
        - APIKeyHeader: []
        - APIKeyQuery: []
      description:
        Estimate the fees required to process the query. The `body`, `init_code`, and `init_data` fields accept
        serialized, base64-encoded values.
      tags:
        - API v2
      summary: Estimate fee
      operationId: api_v3_post_v2_estimate_fee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2EstimateFeeRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2EstimateFeeResult"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestError"
  /api/v3/jetton/burns:
    get:
      security:
        - APIKeyHeader: []
        - APIKeyQuery: []
      description: Query jetton burns that match the specified filters.
      tags:
        - Jettons
      summary: Get jetton burns
      operationId: api_v3_get_jetton_burns
      parameters:
        - name: owner_address
          in: query
          description: Jetton wallet owner addresses. Repeat the parameter to supply multiple addresses. Takes precedence over `address`.
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: address
          in: query
          description: "Address of the jetton wallet owner in any form. Maximum: 1000 addresses. Used when `owner_address` is not supplied."
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: jetton_wallet
          in: query
          description: "Jetton wallet address in any form. Maximum: 1000 addresses."
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: jetton_master
          in: query
          description: Jetton master address in any form.
          schema:
            type: string
