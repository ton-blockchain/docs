            minimum: 0
        - name: start_lt
          in: query
          description: Query traces where `end_lt` is at or above the specified value.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: end_lt
          in: query
          description: Query traces where `end_lt` is at or below the specified value.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: include_actions
          in: query
          description: Include trace actions.
          schema:
            type: boolean
            default: false
        - name: supported_action_types
          in: query
          description: Supported action types or version shortcuts. See [classification presets](/api/v3/action-types#classification-presets).
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: limit
          in: query
          description: Limit the number of rows to return. Use with `offset` to batch requests.
          schema:
            type: integer
            format: int32
            default: 10
            minimum: 1
            maximum: 1000
        - name: offset
          in: query
          description: Skip the first N rows. Use with `limit` to batch requests.
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: sort
          in: query
          description: Sort traces by `lt`.
          schema:
            type: string
            default: desc
            enum:
              - asc
              - desc
        - name: X-Actions-Version
          in: header
          description: Action type or version shortcut. Overrides `supported_action_types` when supplied. Defaults to `latest` when neither is supplied.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TracesResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestError"
  /api/v3/transactions:
    get:
      security:
        - APIKeyHeader: []
        - APIKeyQuery: []
      description: Query transactions that match the specified filters.
      tags:
        - Blockchain data
      summary: Get transactions
      operationId: api_v3_get_transactions
      parameters:
        - name: workchain
          in: query
          description: Workchain of the block.
          schema:
            type: integer
            format: int32
        - name: shard
          in: query
          description: "Block shard ID. Provide this parameter with `workchain`. Example: `8000000000000000`."
          schema:
            type: string
        - name: seqno
          in: query
          description: "Sequence number of the block. Provide this parameter with `workchain` and `shard`."
          schema:
            type: integer
            format: int32
        - name: mc_seqno
          in: query
          description: Masterchain block sequence number.
          schema:
            type: integer
            format: int32
        - name: account
          in: query
          description: List of account addresses for the transactions. Provide addresses in hex, base64, or base64url form.
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: exclude_account
          in: query
          description: Exclude transactions for the specified account addresses.
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: hash
          in: query
          description: Transaction hash.
          schema:
            type: string
        - name: lt
          in: query
          description: Transaction `lt`.
          schema:
            type: integer
            format: int64
        - name: start_utime
          in: query
          description: Query transactions with a generation timestamp at or after the specified timestamp.
          schema:
            type: integer
            format: int32
            minimum: 0
        - name: end_utime
          in: query
          description: Query transactions with a generation timestamp at or before the specified timestamp.
          schema:
            type: integer
            format: int32
            minimum: 0
        - name: start_lt
          in: query
          description: Query transactions where `lt` is at or above the specified value.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: end_lt
          in: query
          description: Query transactions where `lt` is at or below the specified value.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          description: Limit the number of rows to return. Use with `offset` to batch requests.
          schema:
            type: integer
            format: int32
            default: 10
            minimum: 1
            maximum: 1000
        - name: offset
          in: query
          description: Skip the first N rows. Use with `limit` to batch requests.
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: sort
          in: query
          description: Sort transactions by `lt`.
          schema:
            type: string
            default: desc
            enum:
              - asc
              - desc
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionsResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestError"
  /api/v3/transactionsByMasterchainBlock:
    get:
      security:
        - APIKeyHeader: []
        - APIKeyQuery: []
      description: Return transactions from the specified masterchain block and all its shards.
      tags:
        - Blockchain data
      summary: Get transactions by masterchain block
      operationId: api_v3_get_transactions_by_masterchain_block
      parameters:
        - name: seqno
          in: query
          description: Masterchain block sequence number.
          required: true
          schema:
            type: integer
            format: int32
        - name: limit
          in: query
          description: Limit the number of rows to return. Use with `offset` to batch requests.
          schema:
            type: integer
            format: int32
            default: 10
            minimum: 1
            maximum: 1000
        - name: offset
          in: query
          description: Skip the first N rows. Use with `limit` to batch requests.
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: sort
          in: query
          description: Sort transactions by `lt`.
          schema:
            type: string
            default: desc
            enum:
              - asc
              - desc
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionsResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestError"
  /api/v3/transactionsByMessage:
    get:
      security:
        - APIKeyHeader: []
        - APIKeyQuery: []
      description: Get transactions whose inbound or outbound message matches the specified filters. Supply at least one of `msg_hash`, `body_hash`, or `opcode`. Message hash collisions can produce multiple transactions.
      tags:
        - Blockchain data
      summary: Get transactions by message
      operationId: api_v3_get_transactions_by_message
      parameters:
        - name: msg_hash
          in: query
          description: Message hash in hex, base64, or base64url form. Repeat the parameter to supply multiple hashes.
          explode: true
          schema:
            anyOf:
              - type: string
              - type: array
                items:
                  type: string
        - name: body_hash
          in: query
          description: Hash of message body.
          schema:
            type: string
        - name: opcode
          in: query
          description: Opcode of message in hex or signed 32-bit decimal form. An unprefixed value that parses as unsigned 32-bit hexadecimal is interpreted as hexadecimal. This filter matches inbound messages.
          schema:
            type: string
        - name: source
          in: query
          description: Source address of a matching message.
          schema:
            type: string
        - name: destination
          in: query
          description: Destination address of a matching message.
          schema:
            type: string
        - name: direction
          in: query
          description: Direction of the message.
          schema:
            type: string
            enum:
              - in
              - out
        - name: limit
          in: query
          description: Limit the number of rows to return. Use with `offset` to batch requests.
          schema:
            type: integer
            format: int32
            default: 10
            minimum: 1
            maximum: 1000
        - name: offset
          in: query
          description: Skip the first N rows. Use with `limit` to batch requests.
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: sort
          in: query
          description: Sort transactions by logical time.
          schema:
            type: string
            default: desc
            enum:
              - asc
              - desc
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionsResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestError"
  /api/v3/vesting:
    get:
      security:
        - APIKeyHeader: []
        - APIKeyQuery: []
      description: Query vesting contracts that match the specified filters.
      tags:
        - Vesting
      summary: Get vesting contracts
      operationId: api_v3_get_vesting_contracts
      parameters:
        - name: contract_address
          in: query
          description: "Vesting contract address in any form. Maximum: 1000 addresses."
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: wallet_address
          in: query
          description: "Wallet address to filter by owner or sender. Maximum: 1000 addresses."
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: check_whitelist
          in: query
          description: Check whether the wallet address is on the whitelist.
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          description: Limit the number of rows to return. Use with `offset` to batch requests.
          schema:
            type: integer
            format: int32
            default: 10
            minimum: 1
            maximum: 1000
        - name: offset
          in: query
          description: Skip the first N rows. Use with `limit` to batch requests.
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VestingContractsResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestError"
  /api/v3/walletInformation:
    get:
      security:
        - APIKeyHeader: []
        - APIKeyQuery: []
      description: >-
        Get wallet smart contract information. Supports the following wallet versions: `v1r1`, `v1r2`, `v1r3`, `v2r1`,
        `v2r2`, `v3r1`, `v3r2`, `v4r1`, `v4r2`, `v5beta`, `v5r1`, and `tg-wallet`. If the account is not a wallet, returns error code
        `409`.
      tags:
        - API v2
      summary: Get wallet information
      operationId: api_v3_get_wallet_information
      parameters:
        - name: address
          in: query
          description: Account address in any form.
          required: true
          schema:
            type: string
        - name: use_v2
          in: query
          description: Use the API v2 method. This option is not recommended.
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2WalletInformation"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestError"
  /api/v3/walletStates:
    get:
      security:
        - APIKeyHeader: []
        - APIKeyQuery: []
      description: Query wallet information for the specified addresses.
      tags:
        - Accounts
      summary: Get wallet states
      operationId: api_v3_get_wallet_states
      parameters:
        - name: address
          in: query
          description: "List of addresses in any form. Maximum: 1000 addresses."
          required: true
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: code_hash
          in: query
          description: Filter the requested addresses by contract code hash. Repeat the parameter to supply multiple hashes.
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletStatesResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestError"
