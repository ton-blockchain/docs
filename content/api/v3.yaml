  securitySchemes:
    APIKeyHeader:
      type: apiKey
      name: X-API-Key
      in: header
      description: "API key header of the form `X-API-Key: <token>`, where `<token>` is the API key. Requests without a key are limited to 1 RPS. Refer to the [authentication guide](/api/v3/authentication) for details."
    APIKeyQuery:
      type: apiKey
      name: api_key
      in: query
      description: API key query parameter of the form `?api_key=<token>`, where `<token>` is the API key. Equivalent to the header method. Refer to the [authentication guide](/api/v3/authentication) for details.
