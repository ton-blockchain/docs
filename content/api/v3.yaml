        - APIKeyHeader: []
        - APIKeyQuery: []
      description: Query messages that match the specified filters.
      tags:
        - Blockchain data
      summary: Get messages
      operationId: api_v3_get_messages
      parameters:
        - name: msg_hash
          in: query
          description: Message hash in hex, base64, or base64url form.
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: body_hash
          in: query
          description: Hash of message body.
          schema:
            type: string
        - name: source
          in: query
          description:
            Source account address in hex, base64, or base64url form. Set this parameter to `null` to return external
            messages.
          schema:
            type: string
        - name: destination
          in: query
          description:
            Destination account address in hex, base64, or base64url form. Set this parameter to `null` to return log
            messages.
          schema:
            type: string
        - name: opcode
          in: query
          description: Opcode of message in hex or signed 32-bit decimal form.
          schema:
            type: string
        - name: start_utime
          in: query
          description: Query messages where `created_at` is at or after the specified timestamp.
          schema:
            type: integer
            format: int32
            minimum: 0
        - name: end_utime
          in: query
          description: Query messages where `created_at` is at or before the specified timestamp.
          schema:
            type: integer
            format: int32
            minimum: 0
        - name: start_lt
          in: query
          description: Query messages where `created_lt` is at or above the specified value.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: end_lt
          in: query
          description: Query messages where `created_lt` is at or below the specified value.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: direction
          in: query
          description: Direction of the message.
          schema:
            type: string
            enum:
              - in
              - out
        - name: exclude_externals
          in: query
          description: Exclude external messages.
          schema:
            type: boolean
        - name: only_externals
          in: query
          description: Return only external messages.
          schema:
            type: boolean
        - name: limit
          in: query
          description: Limit the number of rows to return. Use with `offset` to batch requests.
          schema:
            type: integer
            format: int32
            default: 10
            minimum: 1
            maximum: 1000
        - name: offset
          in: query
          description: Skip the first N rows. Use with `limit` to batch requests.
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: sort
          in: query
          description: Sort messages by `lt`. To return the latest messages with `sort=desc`, set `start_lt` to `1`.
          schema:
            type: string
            default: desc
            enum:
              - asc
              - desc
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagesResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestError"
