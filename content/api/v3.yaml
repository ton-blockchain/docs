    APIKeyQuery:
      type: apiKey
      name: api_key
      in: query
      description: API key query parameter of the form `?api_key=<token>`, where `<token>` is the API key. Equivalent to the header method. Refer to the [authentication guide](/api/v3/authentication) for details.
